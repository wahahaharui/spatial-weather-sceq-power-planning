name: sceq-lvliang-repro
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.15.3
  - matplotlib=3.8.4
  - scikit-learn=1.5.1
  - joblib=1.4.2
  - pyarrow=14.0.2
  - geopandas=1.1.3
  - rasterio=1.4.3
  - pip
  - pip:
      - gurobipy==11.0.0
      - tensorflow==2.20.0
      # Install torch and torch-geometric separately for the target CUDA/CPU platform.
      # Source environment used torch==2.8.0+cu126 and torch-geometric==2.6.1.
